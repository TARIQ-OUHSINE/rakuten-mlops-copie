# Phase 2 — microservices : serveur MLflow, API d'inference, job d'entrainement.
# Demarrage : docker compose up -d          (mlflow + api)
# Entrainement : docker compose --profile train run --rm trainer

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    # NB: une seule ligne — avec `>` les lignes plus indentées gardent leurs
    # sauts de ligne et les options n'atteignent jamais `mlflow server`.
    # --allowed-hosts : MLflow 3.x rejette les Host headers non-localhost
    # (protection DNS rebinding) — il faut autoriser le nom de service compose.
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --host 0.0.0.0 --port 5000 --allowed-hosts "mlflow:5000,localhost:5001,localhost:5000,127.0.0.1:*"
    environment:
      # Les cookies localhost cumules (Airflow :8080, Supabase :54323...) depassent
      # la limite par defaut de gunicorn (~8 Ko/champ) -> 431 sur l'UI.
      GUNICORN_CMD_ARGS: "--limit-request-field_size 32768"
    volumes:
      - ./mlflow_data:/mlflow
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api

  api:
    build:
      context: .
      target: runtime
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      API_KEY: ${API_KEY:-}
      PREDICTIONS_LOG_PATH: /app/monitoring_data/predictions.jsonl
    volumes:
      - ./monitoring_data:/app/monitoring_data
    depends_on:
      mlflow:
        condition: service_healthy
    # pas de port hote : seul nginx est expose (replicas via --scale api=N)

  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.5.2
    environment:
      # Acces anonyme en lecture seule (Viewer) : le dashboard est provisionne
      # par fichiers, aucun role Admin n'est requis pour le consulter en demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # 3001 cote hote : :3000 est souvent pris par un dev server node
      - "3001:3000"
    depends_on:
      - prometheus

  pushgateway:
    image: prom/pushgateway:v1.11.0
    ports:
      - "9091:9091"

  drift:
    build:
      context: .
      target: monitoring
    profiles: ["drift"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: http://pushgateway:9091
    volumes:
      - ./monitoring_data:/app/monitoring_data
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
      pushgateway:
        condition: service_started

  trainer:
    build:
      context: .
      target: trainer
    profiles: ["train"]
    command: dvc repro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Repo complet monte : dvc repro met a jour dvc.lock, data/ et models/
      # directement sur l'hote (le .git est requis par DVC).
      - .:/app
    depends_on:
      mlflow:
        condition: service_healthy
