      size: 4219
    - path: src/models/train_model.py
      hash: md5
      md5: 5e97ca3971517d800d6c0bbc0305c7cd
      size: 3682
    params:
      params.yaml:
        early_stopping_rounds: 50
        lgbm:
          objective: multiclass
          num_class: 27
          num_leaves: 63
          learning_rate: 0.05
          n_estimators: 500
