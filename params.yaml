# Configuration unique du pipeline baseline (Phase 1 MLOps)
data:
  raw_x: data/x_train.csv
  raw_y: data/y_train.csv
  processed_dir: data/processed

split:
  val_size: 0.15
  random_state: 42

tfidf:
  max_features: 50000
  ngram_range: [1, 2]
  min_df: 2
  sublinear_tf: true
  strip_accents: unicode

lgbm:
  objective: multiclass
  num_class: 27
  num_leaves: 63
  learning_rate: 0.05
  n_estimators: 500
  subsample: 0.8
  colsample_bytree: 0.8
  class_weight: balanced
  random_state: 42
  n_jobs: -1
  verbose: -1

early_stopping_rounds: 50

model:
  dir: models/baseline
  version: baseline-tfidf-lgbm-v1

# Suivi d'experiences (Phase 2) — surcharge par env MLFLOW_TRACKING_URI
# sqlite : le file store (./mlruns) est deprecie depuis MLflow 3.x
mlflow:
  tracking_uri: sqlite:///mlruns.db
  experiment_name: rakuten-baseline
  registered_model_name: rakuten-tfidf-lgbm

# Monitoring & derive (Phase 4)
monitoring:
  predictions_log: monitoring_data/predictions.jsonl
  reports_dir: monitoring_data/reports
  drift_share_threshold: 0.3      # part de colonnes derivees declenchant l'alerte
  min_current_rows: 20            # en dessous : pas assez de trafic pour statuer
  reference_sample: 500           # taille de reference comparable a la fenetre courante
                                  # (reference complete -> tests K-S hypersensibles)
