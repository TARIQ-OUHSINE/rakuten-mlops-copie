# Reverse proxy devant les replicas du service api.
# La resolution DNS se fait PAR REQUETE (resolver Docker + variable) : sans
# variable, nginx figerait l'IP d'un seul replica au demarrage.
events {}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        location / {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
    }
}
