# Scrape les replicas api en direct via le DNS compose (pas via nginx :
# chaque replica doit etre observe individuellement).
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
